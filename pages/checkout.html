<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRONE VEDA | Checkout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <span class="logo-text">DRONE VEDA</span>
      </a>

      <div class="nav-actions">
        <a href="checkout.html" class="mobile-cart"
          style="color: white; text-decoration: none; display: flex; align-items: center; gap: 5px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </a>
        <button class="mobile-toggle" aria-label="Toggle Menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>

      <nav class="nav-menu">
        <a href="../index.html" class="nav-link">HOME</a>
        <a href="workshops.html" class="nav-link">WORKSHOPS</a>
        <a href="products.html" class="nav-link">PRODUCTS</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="checkout.html" class="nav-link active">CART (<span id="cart-count">0</span>)</a>
        <a href="../index.html#contact" class="btn">REQUEST QUOTE</a>
      </nav>
    </div>
  </header>

  <div class="noise-overlay"></div>

  <main style="position: relative; overflow-x: clip; padding-top: 150px; min-height: 80vh;">
    <div class="container">
      <div class="section-header reveal">
        <h2 class="section-title">YOUR CART</h2>
        <p class="section-desc">Review your items and proceed to secure checkout.</p>
      </div>

      <div class="invoice-card" style="margin-bottom: 60px;">
        <div class="invoice-header">
          <div>
            <h2 class="invoice-header-title">DEMO INVOICE</h2>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Drone Veda</div>
          </div>
          <div class="invoice-meta">
            <span id="invoice-date">DATE: </span>
          </div>
        </div>

        <div class="invoice-table-header">
          <div>DESCRIPTION</div>
          <div class="invoice-col-right">QTY</div>
          <div class="invoice-col-right">PRICE</div>
          <div class="invoice-col-right">AMOUNT</div>
        </div>

        <div id="cart-items-container">
          <!-- Cart items will be injected here via JS -->
        </div>

        <div id="cart-summary-container">
          <!-- Summary injected here -->
        </div>

        <div style="margin-top: 40px; text-align: right; display: flex; justify-content: flex-end; gap: 15px;">
          <button id="print-button" class="btn btn-outline"
            style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer; display: none; font-family: var(--font-mono);"
            onclick="window.print()">PRINT INVOICE</button>
          <button id="rzp-button" class="btn"
            style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer; border:none; display: none; font-family: var(--font-mono);">AUTHORIZE
            PAYMENT &rarr;</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="modern-footer">
    <div class="footer-bottom-bar container">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <a href="../index.html" class="footer-logo-small">
          <img src="../assets/img/logo-footer.png" alt="Drone Veda" style="height: 64px;">
        </a>
      </div>
      <div class="footer-legal-links">
        <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">Secured Checkout</span>
      </div>
    </div>
  </footer>

  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/cart.js"></script>

  <script>
    function renderCheckoutCart() {
      const cartContainer = document.getElementById('cart-items-container');
      const cartSummaryContainer = document.getElementById('cart-summary-container');
      const rzpButton = document.getElementById('rzp-button');

      // Set invoice meta
      let today = new Date();
      document.getElementById('invoice-date').innerText = 'DATE: ' + today.toLocaleDateString('en-GB');

      // Breakdown elements
      let currentCart = JSON.parse(localStorage.getItem('droneveda_cart')) || [];
      let subTotal = 0;
      let tax = 0; // Placeholder for taxes
      let discount = 0; // Placeholder for discounts

      if (currentCart.length === 0) {
        cartContainer.innerHTML = '<div style="padding: 20px 0; color: var(--text-muted); text-align: center;">No items registered.</div>';
        cartSummaryContainer.innerHTML = '';
        rzpButton.style.display = 'inline-block';
        document.getElementById('print-button').style.display = 'inline-block';
        
        rzpButton.onclick = function (e) {
          e.preventDefault();
          showToast("Cart is empty! Add products to proceed.");
        };
      } else {
        rzpButton.style.display = 'inline-block';
        document.getElementById('print-button').style.display = 'inline-block';
        cartContainer.innerHTML = ''; // clear existing

        currentCart.forEach(item => {
          const itemTotal = item.price * item.quantity;
          subTotal += itemTotal;

          cartContainer.innerHTML += `
            <div class="invoice-row">
              <div>
                <strong style="color: var(--text-primary);">${item.name}</strong>
              </div>
              <div class="invoice-col-right">
                <div class="cart-controls" style="display:inline-flex; width: 120px;" data-product="${item.name}" data-price="${item.price}"></div>
              </div>
              <div class="invoice-col-right">₹${Number(item.price).toFixed(2)}</div>
              <div class="invoice-col-right" style="color: var(--text-primary); font-weight: bold;">₹${itemTotal.toFixed(2)}</div>
            </div>
          `;
        });

        let makingCharges = 0;
        let platformFees = Math.round(subTotal * 0.02); // 2% Platform fee
        let totalAmount = subTotal + tax + makingCharges + platformFees - discount;

        let breakdownHTML = `
          <div class="invoice-summary-box">
            <div class="invoice-summary-row">
              <span>Subtotal</span>
              <span>₹${subTotal.toFixed(2)}</span>
            </div>
            <div class="invoice-summary-row">
              <span>Making Charges</span>
              <span>₹${makingCharges.toFixed(2)}</span>
            </div>
            <div class="invoice-summary-row">
              <span>Platform Fees (2%)</span>
              <span>₹${platformFees.toFixed(2)}</span>
            </div>
            <div class="invoice-summary-row">
              <span>Estimated Taxes (18%)</span>
              <span>₹${tax.toFixed(2)}</span>
            </div>
            <div class="invoice-summary-row" style="color: var(--logo-green);">
              <span>Discounts</span>
              <span>-₹${discount.toFixed(2)}</span>
            </div>
            <div class="invoice-summary-total">
              <span>TOTAL DUE</span>
              <span>₹${totalAmount.toFixed(2)}</span>
            </div>
          </div>
        `;

        cartSummaryContainer.innerHTML = breakdownHTML;

        // Re-bind payment integration based on new total
        rzpButton.onclick = function (e) {
          e.preventDefault();

          // Redirect to payment-unavailable page
          window.location.href = "payment-unavailable.html";
        };

        // Render the +- buttons
        renderAllCartControls();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCheckoutCart();
    });
  </script>
</body>

</html>
